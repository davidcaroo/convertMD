<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="greenBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- App Window Shadow & Frame -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="860" height="690" rx="16" fill="#11111b" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M 20 36 A 16 16 0 0 1 36 20 L 864 20 A 16 16 0 0 1 880 36 L 880 58 L 20 58 Z" fill="#181825"/>
    <circle cx="44" cy="39" r="6" fill="#f38ba8"/>
    <circle cx="64" cy="39" r="6" fill="#f9e2af"/>
    <circle cx="84" cy="39" r="6" fill="#a6e3a1"/>
    <text x="450" y="44" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">ConvertMD - Conversión Exitosa</text>
    
    <!-- Window Inner Container -->
    <rect x="40" y="78" width="820" height="612" rx="14" fill="#181825" stroke="#252538" stroke-width="1"/>

    <!-- Header Section with Success Badge -->
    <g transform="translate(64, 98)">
      <text x="0" y="26" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">ConvertMD</text>
      <!-- Success Badge -->
      <rect x="140" y="6" width="168" height="26" rx="6" fill="#1e3a29" stroke="#22c55e" stroke-width="1"/>
      <!-- Checkmark vector icon -->
      <path d="M 152 19 L 157 24 L 166 14" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="174" y="23" fill="#22c55e" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Conversión Completa</text>
      
      <!-- Stats Pills Bar -->
      <g transform="translate(325, 4)">
        <rect x="0" y="0" width="105" height="30" rx="6" fill="#1e1e2e" stroke="#313244"/>
        <text x="52" y="20" fill="#cdd6f4" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle">184 líneas</text>

        <rect x="115" y="0" width="115" height="30" rx="6" fill="#1e1e2e" stroke="#313244"/>
        <text x="172" y="20" fill="#cdd6f4" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle">2,420 palabras</text>

        <rect x="240" y="0" width="105" height="30" rx="6" fill="#1e1e2e" stroke="#313244"/>
        <text x="292" y="20" fill="#89b4fa" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle">0.38 seg</text>

        <rect x="355" y="0" width="95" height="30" rx="6" fill="#1e1e2e" stroke="#313244"/>
        <text x="402" y="20" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle">18.4 KB</text>
      </g>
    </g>

    <!-- Source & Target Header -->
    <g transform="translate(64, 146)">
      <rect x="0" y="0" width="772" height="40" rx="8" fill="#1e1e2e" stroke="#313244"/>
      <text x="16" y="25" fill="#a6adc8" font-family="'JetBrains Mono', monospace" font-size="12">Origen: <tspan fill="#fab387">reporte_anual_ia.docx</tspan> → Destino: <tspan fill="#a6e3a1">reporte_anual_ia.md</tspan></text>
      <text x="756" y="25" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="end">Codificación: UTF-8</text>
    </g>

    <!-- Live Markdown Preview Box (Adjusted height for breathing room) -->
    <g transform="translate(64, 200)">
      <rect x="0" y="0" width="772" height="340" rx="10" fill="#11111b" stroke="#313244"/>
      <!-- Top mini bar of preview -->
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 762 0 A 10 10 0 0 1 772 10 L 772 32 L 0 32 Z" fill="#181825"/>
      <text x="16" y="21" fill="#6c7086" font-family="'JetBrains Mono', monospace" font-size="11">PREVISUALIZACIÓN EN VIVO (MARKDOWN GFM)</text>
      
      <!-- Markdown Content rendered with syntax colors -->
      <g transform="translate(20, 56)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" line-height="19">
        <text x="0" y="0" fill="#89b4fa" font-weight="700"># Informe Ejecutivo: Implementación de Modelos RAG y LLMs</text>
        <text x="0" y="24" fill="#6c7086">&gt; Documento extraído automáticamente con ConvertMD potenciado por Microsoft MarkItDown</text>
        
        <text x="0" y="52" fill="#cdd6f4">El presente reporte resume los resultados de las conversiones de documentos empresariales</text>
        <text x="0" y="70" fill="#cdd6f4">hacia formatos listos para ingesta vectorial en bases de datos como Pinecone o ChromaDB.</text>

        <text x="0" y="100" fill="#89b4fa" font-weight="700">## Tabla Comparativa de Eficiencia y Rendimiento</text>

        <!-- Markdown Table rendering -->
        <text x="0" y="126" fill="#a6e3a1">| Formato Entrada | Motor de Extracción | Tiempo (s) | Calidad de Tablas | Tokens Ahorrados |</text>
        <text x="0" y="144" fill="#6c7086">|-----------------|---------------------|------------|-------------------|------------------|</text>
        <text x="0" y="162" fill="#cdd6f4">| <tspan fill="#f9e2af">.docx</tspan>           | Microsoft MarkItDown| <tspan fill="#89b4fa">0.38s</tspan>      | 100% Jerárquico   | +42% optimizado  |</text>
        <text x="0" y="180" fill="#cdd6f4">| <tspan fill="#f9e2af">.xlsx</tspan>           | MarkItDown + OpenPy | <tspan fill="#89b4fa">0.45s</tspan>      | Grid Markdown     | +65% claridad    |</text>
        <text x="0" y="198" fill="#cdd6f4">| <tspan fill="#f9e2af">.pdf</tspan>            | PDFMiner + WinOCR   | <tspan fill="#89b4fa">0.82s</tspan>      | Preservado        | +38% precisión   |</text>
        <text x="0" y="216" fill="#cdd6f4">| <tspan fill="#f9e2af">.png (OCR)</tspan>      | Windows Native OCR  | <tspan fill="#89b4fa">0.29s</tspan>      | Texto extraído    | N/A              |</text>

        <text x="0" y="244" fill="#89b4fa" font-weight="700">## Conclusiones Técnicas</text>
        <text x="0" y="264" fill="#cdd6f4">- Documento listo para inyección de contexto en agentes autónomos sin preprocesamiento extra.</text>
      </g>
    </g>

    <!-- Bottom Action Buttons Toolbar (Separated with generous breathing room, vector icons, no emojis) -->
    <g transform="translate(64, 568)">
      <!-- Download Button with SVG Disk Vector -->
      <g>
        <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#greenBtn)"/>
        <!-- Disk icon -->
        <path d="M 24 16 L 24 32 A 2 2 0 0 0 26 34 L 38 34 A 2 2 0 0 0 40 32 L 40 18 L 36 14 L 26 14 A 2 2 0 0 0 24 16 Z" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <polyline points="28,34 28,26 36,26 36,34" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <rect x="28" y="14" width="6" height="5" fill="#ffffff"/>
        <text x="122" y="29" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Guardar Archivo .md</text>
      </g>

      <!-- Copy Button with SVG Clipboard Vector -->
      <g transform="translate(226, 0)">
        <rect x="0" y="0" width="185" height="48" rx="10" fill="url(#blueBtn)"/>
        <!-- Clipboard icon -->
        <rect x="22" y="17" width="14" height="18" rx="2" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <path d="M 26 17 V 15 A 2 2 0 0 1 28 13 H 30 A 2 2 0 0 1 32 15 V 17" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="106" y="29" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Copiar Markdown</text>
      </g>

      <!-- Open Folder Button with SVG Folder Vector -->
      <g transform="translate(427, 0)">
        <rect x="0" y="0" width="175" height="48" rx="10" fill="#313244"/>
        <!-- Folder icon -->
        <path d="M 22 17 L 27 17 L 30 20 L 38 20 A 2 2 0 0 1 40 22 L 40 32 A 2 2 0 0 1 38 34 L 22 34 A 2 2 0 0 1 20 32 L 20 19 A 2 2 0 0 1 22 17 Z" stroke="#cdd6f4" stroke-width="1.8" fill="none"/>
        <text x="104" y="29" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Abrir Carpeta</text>
      </g>

      <!-- Convert Another Button with SVG Refresh Vector -->
      <g transform="translate(618, 0)">
        <rect x="0" y="0" width="154" height="48" rx="10" fill="#1e1e2e" stroke="#45475a"/>
        <!-- Refresh icon -->
        <path d="M 24 24 A 6 6 0 1 1 26 28 M 24 18 L 24 24 L 30 24" stroke="#a6adc8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="94" y="29" fill="#a6adc8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Convertir Otro</text>
      </g>
    </g>
  </g>
</svg>
